<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with Semantic UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
    <style>
        .chat-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 1em;
            background: #f9fafb;
            margin-bottom: 1em;
        }

        .message {
            margin-bottom: 1em;
            clear: both;
        }

        .message.left {
            text-align: left;
        }

        .message.right {
            text-align: right;
        }

        .message-header {
            font-size: 0.85em;
            font-weight: bold;
            color: #2185d0;
            margin-bottom: 0.25em;
        }

        .message.left .message-header {
            text-align: left;
        }

        .message.right .message-header {
            text-align: right;
            color: #21ba45; /* другой цвет для "вашего" имени, опционально */
        }

        .message .content {
            display: inline-block;
            padding: 0.75em 1em;
            border-radius: 0.5em;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.left .content {
            background-color: #f0f0f0;
            color: #333;
        }

        .message.right .content {
            background-color: #2185d0;
            color: white;
        }

        .message-time {
            font-size: 0.75em;
            color: #888;
            margin-top: 0.25em;
        }

        .message.left .message-time {
            text-align: left;
        }

        .message.right .message-time {
            text-align: right;
        }
    </style>
</head>
<body>

<div class="ui container">
    <h2 class="ui header">Чат</h2>

    <div class="chat-container" id="chat">
        <div class="message left">
            <div class="message-header">Алиса</div>
            <div class="content">Привет! Как дела?</div>
            <div class="message-time">10 окт. 2025, 14:30</div>
        </div>

        <div class="message right">
            <div class="message-header">Вы</div>
            <div class="content">Всё отлично, спасибо!</div>
            <div class="message-time">10 окт. 2025, 14:31</div>
        </div>

        <div class="message left">
            <div class="message-header">Алиса</div>
            <div class="content">Хочешь обсудить Semantic UI?</div>
            <div class="message-time">10 окт. 2025, 14:32</div>
        </div>

        <div class="message right">
            <div class="message-header">Вы</div>
            <div class="content">Конечно! Это отличный фреймворк.</div>
            <div class="message-time">10 окт. 2025, 14:33</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
</body>
</html>
